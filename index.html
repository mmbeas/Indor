<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #1da1f2;
      --bg: #e6ecf0;
      --card: #fff;
      --text: #0f1419;
      --muted: #536471;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; color: var(--text); }
    header { background: var(--primary); color: #fff; padding: 1rem; text-align: center; font-size: 1.6rem; font-weight: 700; position: sticky; top: 0; }
    nav { display: flex; justify-content: center; gap: .5rem; background: #fff; border-bottom: 1px solid #ddd; position: sticky; top: 64px; padding: .25rem .5rem; }
    nav button { padding: .6rem 1rem; border: none; background: #fff; cursor: pointer; font-weight: 600; border-radius: 999px; }
    nav button.active { background: #e8f4fd; color: var(--primary); border: 1px solid #cde8fb; }
    .container { max-width: 680px; margin: auto; padding: 1rem; }
    input, textarea { width: 100%; padding: .7rem; margin: .3rem 0; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; }
    button.action { background: var(--primary); color: white; border: none; padding: .6rem 1.2rem; border-radius: 999px; cursor: pointer; font-weight: 700; }
    button.ghost { background: #fff; color: var(--primary); border: 1px solid #cde8fb; padding: .6rem 1.2rem; border-radius: 999px; font-weight: 700; cursor: pointer; }
    button.danger { background: #ef4444; color: #fff; border: none; padding: .6rem 1rem; border-radius: 999px; font-weight: 700; cursor: pointer; }
    .card { background: var(--card); border: 1px solid #e5e7eb; padding: 1rem; border-radius: 14px; margin-top: 1rem; }
    .card strong { color: var(--primary); cursor: pointer; }
    .card img { max-width: 100%; border-radius: 12px; margin-top: .5rem; }
    .profile-banner { background: var(--primary); height: 140px; border-radius: 12px; margin-bottom: -60px; }
    .profile-info { text-align: center; margin-top: 60px; }
    .avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #fff; background: #ddd; display: inline-grid; place-items: center; font-weight: 800; color: var(--primary); }
    .counts { display: flex; gap: 1rem; justify-content: center; color: var(--muted); }
    .counts strong { color: var(--text); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>Inser</header>

  <nav>
    <button id="homeTab" class="active">🏠 Home</button>
    <button id="profileTab">👤 Profile</button>
    <button id="exploreTab">🔎 Explore</button>
  </nav>

  <div class="container">
    <!-- Sign Up -->
    <section id="signupSection">
      <div class="card">
        <h2>Create account</h2>
        <form id="signupForm">
          <input type="text" id="newUsername" placeholder="Username" required />
          <input type="password" id="newPassword" placeholder="Password" required />
          <button type="submit" class="action">Sign up</button>
        </form>
        <p>Already have an account? <a href="#" id="showSignin">Sign in</a></p>
      </div>
    </section>

    <!-- Sign In -->
    <section id="signinSection" class="hidden">
      <div class="card">
        <h2>Sign in</h2>
        <form id="signinForm">
          <input type="text" id="username" placeholder="Username" required />
          <input type="password" id="password" placeholder="Password" required />
          <button type="submit" class="action">Sign in</button>
        </form>
        <p>Need an account? <a href="#" id="showSignup">Create one</a></p>
      </div>
    </section>

    <!-- Home -->
    <section id="homeSection" class="hidden">
      <div class="card">
        <h2>What's happening?</h2>
        <form id="postForm">
          <textarea id="postInput" rows="3" placeholder="Write a post..."></textarea>
          <input type="file" id="imageInput" accept="image/*" />
          <button type="submit" class="action">Post</button>
        </form>
      </div>
      <div class="card">
        <h2>Timeline</h2>
        <div id="timeline"></div>
      </div>
    </section>

    <!-- Profile -->
    <section id="profileSection" class="hidden">
      <div class="profile-banner"></div>
      <div class="card">
        <div class="profile-info">
          <div class="avatar" id="profileAvatar">I</div>
          <h2 id="profileHandle">@you</h2>
          <p id="profileBio">Welcome to your Inser profile</p>
          <div class="counts">
            <span><strong id="profileFollowers">0</strong> Followers</span>
            <span><strong id="profileFollowing">0</strong> Following</span>
          </div>
          <div>
            <button id="followBtn" class="action hidden">Follow</button>
            <button id="unfollowBtn" class="ghost hidden">Unfollow</button>
            <button id="logoutBtn" class="danger">Log out</button>
          </div>
        </div>
      </div>
      <div class="card">
        <h3 id="profilePostsTitle">Your posts</h3>
        <div id="profilePosts"></div>
      </div>
    </section>

    <!-- Explore -->
    <section id="exploreSection" class="hidden">
      <div class="card">
        <h2>Explore users</h2>
        <input type="text" id="searchUser" placeholder="Search username..." />
        <button id="searchBtn" class="ghost">Search</button>
        <div id="usersList"></div>
      </div>
    </section>
  </div>
