<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --primary:#1da1f2;
  --bg:#e6ecf0;
  --card:#fff;
  --text:#0f1419;
  --muted:#536471;
}
body {
  margin:0;
  font-family:Segoe UI, system-ui, sans-serif;
  background:var(--bg);
}
header {
  background:var(--primary);
  color:#fff;
  padding:1rem;
  text-align:center;
  font-size:1.6rem;
  font-weight:700;
}
nav {
  display:flex;
  justify-content:center;
  gap:.5rem;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:.5rem;
}
nav button {
  padding:.5rem 1rem;
  border:none;
  background:#fff;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
}
nav button.active {
  background:#e8f4fd;
  color:var(--primary);
}
.container {
  max-width:700px;
  margin:auto;
  padding:1rem;
}
.card {
  background:var(--card);
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:1rem;
  margin-bottom:1rem;
}
input, textarea {
  width:100%;
  padding:.7rem;
  margin:.4rem 0;
  border:1px solid #cbd5e1;
  border-radius:10px;
}
button.action {
  background:var(--primary);
  color:#fff;
  border:none;
  padding:.5rem 1rem;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}
button.like {
  background:#f1f5f9;
  border:none;
  border-radius:999px;
  padding:.3rem .8rem;
  cursor:pointer;
}
.hidden { display:none; }
.muted { color:var(--muted); }
.post img {
  max-width:100%;
  border-radius:12px;
  margin-top:.5rem;
}
a { color:var(--primary); text-decoration:none; }
</style>
</head>

<body>

<header>Inser</header>

<nav>
  <button id="homeTab" class="active">🏠 Home</button>
  <button id="profileTab">👤 Profile</button>
</nav>

<div class="container">

<!-- SIGN UP -->
<section id="signupSection" class="hidden">
  <div class="card">
    <h2>Create account</h2>
    <input id="newUsername" placeholder="Username">
    <input id="newPassword" type="password" placeholder="Password">
    <button id="signupBtn" class="action">Sign up</button>
    <p class="muted">
      Already have an account?
      <a href="#" id="goSignin">Sign in</a>
    </p>
  </div>
</section>

<!-- SIGN IN -->
<section id="signinSection">
  <div class="card">
    <h2>Sign in</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="signinBtn" class="action">Sign in</button>
    <p class="muted">
      No account?
      <a href="#" id="goSignup">Create one</a>
    </p>
  </div>
</section>

<!-- HOME -->
<section id="homeSection" class="hidden">

  <div class="card">
    <textarea id="postInput" rows="3" placeholder="Write a post..."></textarea>
    <button id="postBtn" class="action">Post</button>
  </div>

  <div class="card">
    <h3>🔥 Trending</h3>
    <div id="trending"></div>
  </div>

  <div class="card">
    <h3>Latest Posts</h3>
    <div id="timeline"></div>
  </div>

</section>

<!-- PROFILE -->
<section id="profileSection" class="hidden">
  <div class="card">
    <h2 id="profileHandle">@user</h2>
    <div id="profilePosts"></div>
    <button id="logoutBtn" class="action">Log out</button>
  </div>
</section>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

let users = JSON.parse(localStorage.getItem("users")) || [];
let posts = JSON.parse(localStorage.getItem("posts")) || [];
let currentUser = localStorage.getItem("currentUser");

const signupSection = document.getElementById("signupSection");
const signinSection = document.getElementById("signinSection");
const homeSection = document.getElementById("homeSection");
const profileSection = document.getElementById("profileSection");

const homeTab = document.getElementById("homeTab");
const profileTab = document.getElementById("profileTab");

const timeline = document.getElementById("timeline");
const trending = document.getElementById("trending");
const profilePosts = document.getElementById("profilePosts");
const profileHandle = document.getElementById("profileHandle");

function show(section) {
  [signupSection, signinSection, homeSection, profileSection]
    .forEach(s => s.classList.add("hidden"));
  section.classList.remove("hidden");
}

function save() {
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("posts", JSON.stringify(posts));
  if (currentUser) localStorage.setItem("currentUser", currentUser);
  else localStorage.removeItem("currentUser");
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])
  );
}

/* AUTH */
signupBtn.onclick = () => {
  const u = newUsername.value.trim();
  const p = newPassword.value.trim();
  if (!u || !p) return alert("Fill all fields");
  if (users.find(x => x.username === u)) return alert("User exists");
  users.push({username:u, password:p});
  save();
  show(signinSection);
};

signinBtn.onclick = () => {
  const u = username.value.trim();
  const p = password.value.trim();
  const user = users.find(x => x.username===u && x.password===p);
  if (!user) return alert("Wrong login");
  currentUser = u;
  save();
  show(homeSection);
  renderAll();
};

logoutBtn.onclick = () => {
  currentUser = null;
  save();
  show(signinSection);
};

/* SWITCH FORMS */
goSignup.onclick = e => { e.preventDefault(); show(signupSection); };
goSignin.onclick = e => { e.preventDefault(); show(signinSection); };

/* NAV */
homeTab.onclick = () => {
  if (!currentUser) return;
  homeTab.classList.add("active");
  profileTab.classList.remove("active");
  show(homeSection);
  renderAll();
};

profileTab.onclick = () => {
  if (!currentUser) return;
  profileTab.classList.add("active");
  homeTab.classList.remove("active");
  show(profileSection);
  renderProfile();
};

/* POST */
postBtn.onclick = () => {
  const text = postInput.value.trim();
  if (!text || !currentUser) return;
  posts.push({
    user: currentUser,
    text,
    likes:0,
    likedBy:[],
    ts:Date.now()
  });
  save();
  postInput.value="";
  renderAll();
};

/* LIKE */
function toggleLike(i) {
  const p = posts[i];
  if (p.likedBy.includes(currentUser)) {
    p.likedBy = p.likedBy.filter(u=>u!==currentUser);
    p.likes--;
  } else {
    p.likedBy.push(currentUser);
    p.likes++;
  }
  save();
  renderAll();
}

/* RENDER */
function renderAll() {
  timeline.innerHTML="";
  posts.slice().sort((a,b)=>b.ts-a.ts).forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="card post";
    d.innerHTML=`
      <strong>@${p.user}</strong>
      <p>${escapeHtml(p.text)}</p>
      <button class="like">❤️ ${p.likes}</button>
    `;
    d.querySelector("button").onclick=()=>toggleLike(i);
    timeline.appendChild(d);
  });
  renderTrending();
}

function renderTrending() {
  trending.innerHTML="";
  posts.slice().sort((a,b)=>b.likes-a.likes).slice(0,3)
    .forEach(p=>{
      trending.innerHTML+=`<p>@${p.user} • ❤️ ${p.likes}</p>`;
    });
}

function renderProfile() {
  profileHandle.textContent="@"+currentUser;
  profilePosts.innerHTML="";
  posts.filter(p=>p.user===currentUser)
    .forEach(p=>{
      profilePosts.innerHTML+=`
        <div class="card">
          <p>${escapeHtml(p.text)}</p>
          ❤️ ${p.likes}
        </div>`;
    });
}

/* START */
show(signinSection);

});
</script>

</body>
</html>
