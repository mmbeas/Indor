<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inser</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #e6ecf0; margin: 0; }
    header { background: #1da1f2; color: white; padding: 1rem; text-align: center; font-size: 1.5rem; font-weight: bold; }
    nav { display: flex; justify-content: space-around; background: #fff; border-bottom: 1px solid #ddd; }
    nav button { flex: 1; padding: 1rem; border: none; background: #fff; cursor: pointer; font-size: 1rem; }
    nav button.active { border-bottom: 3px solid #1da1f2; font-weight: bold; color: #1da1f2; }
    .container { max-width: 600px; margin: auto; padding: 1rem; }
    input, textarea { width: 100%; padding: 0.7rem; margin: 0.5rem 0; border: 1px solid #ccc; border-radius: 8px; }
    button.action { background: #1da1f2; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .card { background: white; border: 1px solid #ddd; padding: 1rem; margin-top: 1rem; border-radius: 12px; }
    .card strong { color: #1da1f2; }
    .card img { max-width: 100%; margin-top: 0.5rem; border-radius: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>Inser</header>

  <nav>
    <button id="homeTab" class="active">🏠 Home</button>
    <button id="profileTab">👤 Profile</button>
  </nav>

  <div class="container">
    <!-- Account Creation -->
    <section id="signupSection">
      <h2>Create Account</h2>
      <form id="signupForm">
        <input type="text" id="newUsername" placeholder="Choose a username" required>
        <input type="password" id="newPassword" placeholder="Choose a password" required>
        <button type="submit" class="action">Sign Up</button>
      </form>
      <p>Already have an account? <a href="#" id="showSignin">Sign In</a></p>
    </section>

    <!-- Sign In -->
    <section id="signinSection" class="hidden">
      <h2>Sign In</h2>
      <form id="signinForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="action">Sign In</button>
      </form>
      <p>Need an account? <a href="#" id="showSignup">Create one</a></p>
    </section>

    <!-- Home Section -->
    <section id="homeSection" class="hidden">
      <h2>What's happening?</h2>
      <form id="tweetForm">
        <textarea id="tweetInput" rows="3" placeholder="Write a post..."></textarea>
        <input type="file" id="imageInput" accept="image/*">
        <button type="submit" class="action">Post</button>
      </form>
      <h2>Timeline</h2>
      <div id="timeline"></div>
    </section>

    <!-- Profile Section -->
    <section id="profileSection" class="hidden">
      <div id="profileInfo"></div>
      <h3>Your Posts</h3>
      <div id="myTweets"></div>
    </section>
  </div>

  <script>
    const signupSection = document.getElementById("signupSection");
    const signinSection = document.getElementById("signinSection");
    const homeSection = document.getElementById("homeSection");
    const profileSection = document.getElementById("profileSection");

    const signupForm = document.getElementById("signupForm");
    const signinForm = document.getElementById("signinForm");
    const showSignin = document.getElementById("showSignin");
    const showSignup = document.getElementById("showSignup");

    const tweetForm = document.getElementById("tweetForm");
    const tweetInput = document.getElementById("tweetInput");
    const imageInput = document.getElementById("imageInput");
    const timeline = document.getElementById("timeline");
    const myTweets = document.getElementById("myTweets");
    const profileInfo = document.getElementById("profileInfo");

    const homeTab = document.getElementById("homeTab");
    const profileTab = document.getElementById("profileTab");

    let currentUser = null;
    let tweets = JSON.parse(localStorage.getItem("tweets")) || [];
    let users = JSON.parse(localStorage.getItem("users")) || [];

    // Render tweets
    function renderTweets() {
      timeline.innerHTML = "";
      myTweets.innerHTML = "";
      tweets.forEach(tweet => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<strong>@${tweet.user}</strong><p>${tweet.text}</p>`;
        if (tweet.image) {
          const img = document.createElement("img");
          img.src = tweet.image;
          card.appendChild(img);
        }
        timeline.appendChild(card);
        if (tweet.user === currentUser) {
          myTweets.appendChild(card.cloneNode(true));
        }
      });
    }

    // Sign up
    signupForm.addEventListener("submit", e => {
      e.preventDefault();
      const newUsername = document.getElementById("newUsername").value.trim();
      const newPassword = document.getElementById("newPassword").value.trim();

      if (users.find(u => u.username === newUsername)) {
        alert("Username already exists!");
        return;
      }
      users.push({ username: newUsername, password: newPassword });
      localStorage.setItem("users", JSON.stringify(users));
      alert("Account created! Please sign in.");
      signupSection.classList.add("hidden");
      signinSection.classList.remove("hidden");
    });

    // Sign in
    signinForm.addEventListener("submit", e => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      const user = users.find(u => u.username === username && u.password === password);
      if (!user) {
        alert("Invalid credentials!");
        return;
      }
      currentUser = username;
      alert("Signed in as " + username);
      signinSection.classList.add("hidden");
      homeSection.classList.remove("hidden");
      profileInfo.innerHTML = `<h2>@${currentUser}</h2><p>Welcome to your Inser profile!</p>`;
      renderTweets();
    });

    // Switch between signup/signin
    showSignin.addEventListener("click", e => {
      e.preventDefault();
      signupSection.classList.add("hidden");
      signinSection.classList.remove("hidden");
    });
    showSignup.addEventListener("click", e => {
      e.preventDefault();
      signinSection.classList.add("hidden");
      signupSection.classList.remove("hidden");
    });

    // Post
    tweetForm.addEventListener("submit", e => {
      e.preventDefault();
      const text = tweetInput.value.trim();
      const file = imageInput.files[0];
      if (text && currentUser) {
        if (file) {
          const reader = new FileReader();
          reader.onload = event => saveTweet(text, event.target.result);
          reader.readAsDataURL(file);
        } else {
          saveTweet(text, null);
        }
      }
    });

    function saveTweet(text, imageData) {
      const tweet = { user: currentUser, text, image: imageData };
      tweets.unshift(tweet);
      localStorage.setItem("tweets", JSON.stringify(tweets));
      renderTweets();
      tweetInput.value = "";
      imageInput.value = "";
    }

    // Tab switching
    homeTab.addEventListener("click", () => {
      homeTab.classList.add("active");
      profileTab.classList.remove("active");
      homeSection.classList.remove("hidden");
      profileSection.classList.add("hidden");
    });
    profileTab.addEventListener("click", () => {
      profileTab.classList.add("active");
      homeTab.classList.remove("active");
      profileSection.classList.remove("hidden");
      homeSection.classList.add("hidden");
    });

    // Render tweets on load
    renderTweets();
  </script>
</body>
</html>
